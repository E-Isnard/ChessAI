[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turochamp"
version = "0.1.0"
description = "A chess engine and Lichess bot using negamax alpha-beta search."
readme = "Readme.md"
requires-python = ">=3.9"
dependencies = [
    "python-chess>=1.10",
    "berserk>=0.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
turochamp = "turochamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
